services:
  mongo:
    image: docker.io/library/mongo:8.0
    ports:
      - "127.0.0.1:27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: dev
      MONGO_INITDB_ROOT_PASSWORD: dev
    volumes:
      - mongo-data:/data/db

  backend:
    build: .
    command: bun src/main.ts
    init: true
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      MONGODB_URL: mongodb://dev:dev@mongo:27017/myapp?authSource=admin
    depends_on:
      - mongo

  frontend:
    build: .
    command: bun web/server.ts
    init: true
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      BACKEND_URL: http://backend:3000
      PETROCK_AUTHORITY: ${PETROCK_AUTHORITY:-https://petrock.mit.edu}
      PETROCK_CLIENT_ID: ${PETROCK_CLIENT_ID:-DhxUjjKelNYQ}
      PETROCK_CLIENT_SECRET: ${PETROCK_CLIENT_SECRET:-27caf5d08ccc4b9dbfbcfe302ed8c48a}
      PETROCK_REDIRECT_URI: ${PETROCK_REDIRECT_URI:-http://127.0.0.1:8080/auth/petrock/callback}
    depends_on:
      - backend

volumes:
  mongo-data:
